alerts:
  - name: high_latency_p95
    severity: warning
    condition: latency_p95_ms > 3000 for 5m
    type: symptom-based
    owner: oncall-platform
    runbook: docs/alerts.md#alert-1
  - name: elevated_error_rate
    severity: critical
    condition: error_rate_pct > 2 for 5m
    type: symptom-based
    owner: oncall-platform
    runbook: docs/alerts.md#alert-2
  - name: daily_cost_budget_breach
    severity: warning
    condition: daily_cost_usd > 2.5 for 15m
    type: symptom-based
    owner: oncall-ai
    runbook: docs/alerts.md#alert-3
